<style>
:root {
  --bg-obsidian: #06070a;
  --bg-shell: #0b0d14;
  --bg-elevated: #111420;
  --border-subtle: #1c2236;
  --border-glow: #4f46e5;
  --indigo-core: #6366f1;
  --indigo-bright: #818cf8;
  --purple-neon: #a855f7;
  --cyan-neon: #06b6d4;
  --cyan-bright: #22d3ee;
  --emerald-live: #10b981;
  --amber-warn: #f59e0b;
  --rose-alert: #f43f5e;
  --text-main: #e2e8f0;
  --text-muted: #828ba2;
  --text-dim: #475569;
  --font-mono: 'JetBrains Mono', monospace;
  --font-ar: 'Noto Kufi Arabic', system-ui, sans-serif;
  --radius-window: 14px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  background: var(--bg-obsidian);
  color: var(--text-main);
  font-family: var(--font-mono);
  overflow: hidden;
  line-height: 1.5;
}

[lang="ar"] {
  font-family: var(--font-ar), var(--font-mono);
}

::selection {
  background: rgba(99, 102, 241, 0.4);
  color: #fff;
}

/* Background Ambient Lighting */
.cyber-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(1000px 500px at 50% -10%, rgba(99, 102, 241, 0.18), transparent 60%),
    radial-gradient(800px 600px at -10% 40%, rgba(6, 182, 212, 0.10), transparent 55%),
    radial-gradient(700px 700px at 110% 80%, rgba(168, 85, 247, 0.12), transparent 60%);
}

.scanlines {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(rgba(18, 16, 38, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
  background-size: 100% 4px;
  opacity: 0.35;
}

/* Matrix Canvas */
#matrixCanvas {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.5s ease;
}
#matrixCanvas.active {
  opacity: 0.18;
}

/* Main Layout Shell */
.app-container {
  position: relative;
  z-index: 10;
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 16px;
  gap: 12px;
}

@media (max-width: 768px) {
  .app-container {
    padding: 8px;
    gap: 8px;
  }
}

/* Top System Status Bar */
.sys-bar {
  flex: none;
  background: var(--bg-shell);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.78rem;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  flex-wrap: wrap;
  gap: 8px;
}

.sys-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.window-dots {
  display: flex;
  gap: 6px;
}
.dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  display: inline-block;
  cursor: pointer;
  transition: transform .15s;
}
.dot:hover { transform: scale(1.15); }
.dot-red { background: #ef4444; }
.dot-yellow { background: #f59e0b; }
.dot-green { background: #10b981; }

.sys-host {
  color: var(--indigo-bright);
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}

.sys-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 8px;
  background: rgba(16, 185, 129, 0.12);
  border: 1px solid rgba(16, 185, 129, 0.3);
  border-radius: 999px;
  color: var(--emerald-live);
  font-size: 0.72rem;
  font-weight: 600;
}
.sys-status-pill .live-blink {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--emerald-live);
  animation: pulse-live 1.6s infinite;
}
@keyframes pulse-live { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

.sys-right {
  display: flex;
  align-items: center;
  gap: 14px;
  color: var(--text-muted);
}

.sys-meta-item {
  display: flex;
  align-items: center;
  gap: 5px;
}

.lang-switch-btn {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--cyan-bright);
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 0.75rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all .2s;
}
.lang-switch-btn:hover {
  border-color: var(--indigo-bright);
  background: rgba(99, 102, 241, 0.15);
  color: #fff;
}

/* Terminal Console Viewport */
.terminal-window {
  flex: 1;
  background: var(--bg-shell);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-window);
  display: flex;
  flex-direction: column;
  box-shadow: 0 10px 40px rgba(0,0,0,0.7), 0 0 0 1px rgba(99,102,241,0.06);
  overflow: hidden;
  position: relative;
}

.terminal-tabs {
  flex: none;
  background: rgba(11, 13, 20, 0.95);
  border-bottom: 1px solid var(--border-subtle);
  padding: 6px 14px 0;
  display: flex;
  gap: 4px;
  overflow-x: auto;
}

.term-tab {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  font-size: 0.75rem;
  color: var(--text-muted);
  background: transparent;
  border: 1px solid transparent;
  border-bottom: none;
  border-radius: 8px 8px 0 0;
  cursor: pointer;
  white-space: nowrap;
}
.term-tab.active {
  background: var(--bg-elevated);
  color: var(--indigo-bright);
  border-color: var(--border-subtle);
  font-weight: 600;
}
.term-tab:hover:not(.active) {
  color: var(--text-main);
}

.terminal-body {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  overflow-x: hidden;
  scroll-behavior: smooth;
  font-size: 0.88rem;
  line-height: 1.6;
}

@media (max-width: 768px) {
  .terminal-body {
    padding: 12px;
    font-size: 0.8rem;
  }
}

/* Terminal Elements & Typography */
.terminal-output {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.ascii-banner {
  color: var(--indigo-bright);
  font-size: 0.75rem;
  line-height: 1.15;
  white-space: pre;
  user-select: none;
  font-weight: 700;
  margin-bottom: 6px;
  text-shadow: 0 0 18px rgba(99, 102, 241, 0.4);
}

@media (max-width: 650px) {
  .ascii-banner {
    font-size: 0.52rem;
  }
}

.cli-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 10px;
  border-radius: 4px;
  font-size: 0.74rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.badge-indigo { background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.4); color: var(--indigo-bright); }
.badge-cyan { background: rgba(6, 182, 212, 0.15); border: 1px solid rgba(6, 182, 212, 0.4); color: var(--cyan-bright); }
.badge-emerald { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: var(--emerald-live); }
.badge-orange { background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.4); color: var(--amber-warn); }

.cli-title {
  color: #fff;
  font-weight: 800;
  font-size: 1.1rem;
  margin: 6px 0;
  letter-spacing: -0.01em;
}

.cli-desc {
  color: var(--text-muted);
  max-width: 78ch;
  margin-bottom: 10px;
}

.cli-highlight {
  color: var(--cyan-bright);
  font-weight: 600;
}

/* Command Entry Line */
.command-entry {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 8px;
  flex: none;
}

.prompt-prefix {
  color: var(--emerald-live);
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.prompt-dir {
  color: var(--indigo-bright);
}
.prompt-dollar {
  color: var(--cyan-bright);
}

.cli-input-wrapper {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
}

#cliInput {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  caret-color: var(--cyan-bright);
}

/* Cards & Output UI Blocks */
.cli-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-left: 3px solid var(--indigo-bright);
  border-radius: 8px;
  padding: 16px;
  margin: 8px 0;
  transition: all .2s ease;
}
.cli-card:hover {
  border-color: var(--indigo-core);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 15px rgba(99, 102, 241, 0.15);
  transform: translateX(4px);
}
[dir="rtl"] .cli-card {
  border-left: 1px solid var(--border-subtle);
  border-right: 3px solid var(--indigo-bright);
}
[dir="rtl"] .cli-card:hover {
  transform: translateX(-4px);
}

.card-headline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  flex-wrap: wrap;
  gap: 8px;
}

.card-title {
  font-size: 1rem;
  font-weight: 700;
  color: #fff;
}

.card-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 10px 0;
}

.card-tag {
  font-size: 0.72rem;
  padding: 2px 8px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 4px;
  color: var(--text-muted);
}

.card-actions {
  display: flex;
  gap: 12px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.cli-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--cyan-bright);
  text-decoration: none;
  background: rgba(6, 182, 212, 0.08);
  border: 1px solid rgba(6, 182, 212, 0.25);
  border-radius: 6px;
  padding: 4px 12px;
  transition: all .2s;
}
.cli-link:hover {
  background: var(--cyan-bright);
  color: #000;
  box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
}

.cli-link.ph-link {
  color: #ff7a50;
  background: rgba(218, 85, 47, 0.12);
  border-color: rgba(218, 85, 47, 0.35);
}
.cli-link.ph-link:hover {
  background: #da552f;
  color: #fff;
  box-shadow: 0 0 12px rgba(218, 85, 47, 0.5);
}

/* Skills Matrix in Terminal */
.skills-cli-table {
  width: 100%;
  margin: 12px 0;
  border-collapse: collapse;
}
.skills-cli-table th, .skills-cli-table td {
  padding: 8px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 0.82rem;
}
[dir="rtl"] .skills-cli-table th, [dir="rtl"] .skills-cli-table td {
  text-align: right;
}
.skills-cli-table th {
  color: var(--indigo-bright);
  text-transform: uppercase;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
}

.skill-bar-wrap {
  width: 180px;
  background: rgba(255,255,255,0.06);
  border-radius: 4px;
  height: 8px;
  overflow: hidden;
  display: inline-block;
  vertical-align: middle;
  margin-right: 8px;
}
[dir="rtl"] .skill-bar-wrap {
  margin-right: 0;
  margin-left: 8px;
}

.skill-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--indigo-core), var(--cyan-neon));
  border-radius: 4px;
}

/* Bottom Quick Command Dock */
.quick-dock {
  flex: none;
  background: var(--bg-shell);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  overflow-x: auto;
}

.dock-label {
  font-size: 0.72rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  white-space: nowrap;
}

.dock-chips {
  display: flex;
  gap: 8px;
  flex-wrap: nowrap;
}

.dock-chip {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-muted);
  border-radius: 6px;
  padding: 5px 12px;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all .2s;
  white-space: nowrap;
  font-family: inherit;
}
.dock-chip:hover {
  background: rgba(99, 102, 241, 0.15);
  border-color: var(--indigo-bright);
  color: #fff;
  transform: translateY(-2px);
}
.dock-chip.primary-chip {
  background: rgba(99, 102, 241, 0.2);
  border-color: var(--indigo-bright);
  color: var(--indigo-bright);
}
.dock-chip.primary-chip:hover {
  background: var(--indigo-core);
  color: #fff;
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-shell); }
::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--indigo-bright); }
</style>
</head>

<div class="cyber-bg"></div>

<div class="app-container">
  <!-- System Status Bar -->
  <header class="sys-bar">
    <div class="sys-left">
      <div class="window-dots">
        <span class="dot dot-red" onclick="runCommand('clear')" title="Clear console"></span>
        <span class="dot dot-yellow" onclick="runCommand('help')" title="Show commands"></span>
        <span class="dot dot-green" onclick="toggleMatrix()" title="Toggle Matrix mode"></span>
      </div>
      <div class="sys-host">
        <i class="fas fa-terminal"></i>
        <span>serag@cyber-node</span>
      </div>
      <div class="sys-status-pill">
        <span class="live-blink"></span>
        <span id="sysStateText">SYSTEM: ACTIVE</span>
      </div>
    </div>

    <div class="sys-right">
      <span class="sys-meta-item"><i class="fas fa-microchip"></i> Node v22.13</span>
      <span class="sys-meta-item"><i class="fas fa-map-marker-alt"></i> Egypt 🇪🇬</span>
      <span class="sys-meta-item" id="clock">12:00:00 UTC</span>
      <button class="lang-switch-btn" id="langBtn" onclick="toggleLang()">عربي</button>
    </div>
  </header>

  <!-- Interactive Terminal Window -->
  <main class="terminal-window" onclick="focusCli()">
    <div class="terminal-tabs">
      <div class="term-tab active" id="tabSerag"><i class="fas fa-code-branch"></i> serag@portfolio:~$</div>
      <div class="term-tab" onclick="runCommand('mindgate')"><i class="fas fa-brain"></i> mindgate-mcp</div>
      <div class="term-tab" onclick="runCommand('projects')"><i class="fas fa-folder"></i> ~/projects</div>
      <div class="term-tab" onclick="runCommand('contact')"><i class="fas fa-envelope"></i> ~/connect</div>
    </div>

    <div class="terminal-body" id="termBody">
      <div class="terminal-output" id="termOutput">
        <!-- Banner & Welcome will be printed here -->
      </div>

      <div class="command-entry">
        <div class="prompt-prefix">
          <span>aaserag@devbox</span>:<span class="prompt-dir">~</span><span class="prompt-dollar">$</span>
        </div>
        <div class="cli-input-wrapper">
          <input type="text" id="cliInput" autocomplete="off" spellcheck="false" placeholder="type 'help' or click commands below..." />
        </div>
      </div>
    </div>
  </main>

  <!-- Quick Command Dock (Clickable for anyone who doesn't want to type) -->
  <footer class="quick-dock">
    <span class="dock-label"><i class="fas fa-bolt"></i> Quick Actions:</span>
    <div class="dock-chips">
      <button class="dock-chip primary-chip" onclick="runCommand('about')"><i class="fas fa-user-astronaut"></i> about</button>
      <button class="dock-chip primary-chip" onclick="runCommand('projects')"><i class="fas fa-rocket"></i> projects</button>
      <button class="dock-chip" onclick="runCommand('mindgate')"><i class="fas fa-brain"></i> mindgate-mcp</button>
      <button class="dock-chip" onclick="runCommand('skills')"><i class="fas fa-layer-group"></i> skills</button>
      <button class="dock-chip" onclick="runCommand('contact')"><i class="fas fa-paper-plane"></i> contact</button>
      <button class="dock-chip" onclick="runCommand('matrix')"><i class="fas fa-film"></i> matrix</button>
      <button class="dock-chip" onclick="runCommand('help')"><i class="fas fa-question-circle"></i> help</button>
      <button class="dock-chip" onclick="runCommand('clear')"><i class="fas fa-eraser"></i> clear</button>
    </div>
  </footer>
</div>

// Matrix Animation Logic
const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d');
let matrixInterval = null;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const chars = '0123456789ABCDEF@#$%=+*<>[]{}MindGateSerag';
const fontSize = 14;
let columns = Math.floor(canvas.width / fontSize);
let drops = Array(columns).fill(1);

function drawMatrix() {
  ctx.fillStyle = 'rgba(6, 7, 10, 0.06)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#6366f1';
  ctx.font = fontSize + 'px monospace';

  for (let i = 0; i < drops.length; i++) {
    const text = chars.charAt(Math.floor(Math.random() * chars.length));
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
      drops[i] = 0;
    }
    drops[i]++;
  }
}

function toggleMatrix() {
  matrixActive = !matrixActive;
  canvas.classList.toggle('active', matrixActive);
  if (matrixActive) {
    if (!matrixInterval) matrixInterval = setInterval(drawMatrix, 35);
    printRaw(`<div style="color:var(--emerald-live);"><i class="fas fa-check"></i> Cyber Matrix visualizer ACTIVATED. (Click green dot or run 'matrix' to toggle)</div>`);
  } else {
    clearInterval(matrixInterval);
    matrixInterval = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    printRaw(`<div style="color:var(--text-muted);"><i class="fas fa-times"></i> Cyber Matrix visualizer DEACTIVATED.</div>`);
  }
}

function setLang(lang) {
  currentLang = lang;
  document.documentElement.setAttribute('lang', lang);
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.getElementById('langBtn').textContent = lang === 'ar' ? 'English' : 'عربي';
  printRaw(`<div style="color:var(--cyan-bright); font-weight:700;"><i class="fas fa-globe"></i> ${lang === 'ar' ? 'تم تحويل الواجهة إلى اللغة العربية بنجاح.' : 'Interface switched to English.'}</div>`);
  printWelcome();
}

function toggleLang() {
  setLang(currentLang === 'en' ? 'ar' : 'en');
}

function focusCli() {
  cliInput.focus();
}

// Input handling
cliInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    runCommand(cliInput.value);
  } else if (e.key === 'ArrowUp') {
    if (commandHistory.length > 0 && historyIndex > 0) {
      historyIndex--;
      cliInput.value = commandHistory[historyIndex];
    }
    e.preventDefault();
  } else if (e.key === 'ArrowDown') {
    if (historyIndex < commandHistory.length - 1) {
      historyIndex++;
      cliInput.value = commandHistory[historyIndex];
    } else {
      historyIndex = commandHistory.length;
      cliInput.value = '';
    }
    e.preventDefault();
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const val = cliInput.value.toLowerCase().trim();
    if (!val) return;
    const candidates = ['about', 'projects', 'mindgate', 'skills', 'contact', 'stats', 'matrix', 'clear', 'help', 'arabic', 'english'];
    const matched = candidates.find(c => c.startsWith(val));
    if (matched) cliInput.value = matched;
  }
});
